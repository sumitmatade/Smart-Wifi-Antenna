[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-wifi-antenna"
version = "0.1.0"
description = "Automatic RSSI-based positioning of a directional Wi-Fi antenna on a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sumit Sunil Matade" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
pi = ["RPi.GPIO>=0.7.1", "RPLCD>=1.3.1", "smbus2>=0.4.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
smart-antenna = "smart_antenna.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
